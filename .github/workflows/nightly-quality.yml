name: Nightly Quality

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scale-baseline:
    name: Scale and performance baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Install dependencies
        run: uv sync --frozen

      - name: Measure and compare scale baseline
        run: >-
          uv run python scripts/measure_scale_baseline.py
          --repeat 3
          --reference docs/verification/performance-baseline-v1.6.2.json
          --max-regression-factor 3
          --output dist/nightly-scale-baseline.json

      - name: Upload scale evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-scale-baseline-${{ github.run_id }}
          path: dist/nightly-scale-baseline.json
          if-no-files-found: warn
          retention-days: 30

  docx-browser-matrix:
    name: DOCX export (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Install dependencies and browser
        run: |
          uv sync --frozen
          npm --prefix frontend ci --include=optional
          npm --prefix frontend exec playwright install --with-deps ${{ matrix.browser }}

      - name: Run DOCX export matrix
        run: >-
          npm --prefix frontend run test:visual --
          workbench-export-docx.spec.ts
          --project=${{ matrix.browser }}
          --workers=1
          --reporter=list

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-docx-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
